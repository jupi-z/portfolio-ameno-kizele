name: Portfolio quality

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "codex/portfolio-upgrade-2026-11"]

permissions:
  contents: read

concurrency:
  group: portfolio-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-failure-report
          path: |-
            playwright-report/
            test-results/
          retention-days: 7
